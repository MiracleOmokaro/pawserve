  <!-- Eyes -->
  <ellipse cx="74" cy="90" rx="8" ry="9" fill="#3A2A1D"/>
  <ellipse cx="118" cy="90" rx="8" ry="9" fill="#3A2A1D"/>
  <ellipse cx="71" cy="87" rx="3" ry="3" fill="white" opacity="0.9"/>
  <ellipse cx="115" cy="87" rx="3" ry="3" fill="white" opacity="0.9"/>
  <!-- Nose -->
  <ellipse cx="96" cy="106" rx="10" ry="7" fill="#3A2A1D"/>
