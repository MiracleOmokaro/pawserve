  <!-- Paw at bottom -->
  <g transform="translate(96,170)" opacity="0.5">
    <circle cx="0" cy="0" r="5" fill="#E07A2F"/>
    <circle cx="-8" cy="-8" r="3.5" fill="#E07A2F"/>
    <circle cx="8" cy="-8" r="3.5" fill="#E07A2F"/>
