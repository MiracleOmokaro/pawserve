<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#3A2A1D"/>
    </radialGradient>
    <linearGradient id="tongueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F08080"/>
      <stop offset="100%" stop-color="#D95B5B"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bgGrad)"/>

  <!-- Dog face - white fur base -->
  <!-- Head shape -->
  <ellipse cx="60" cy="62" rx="32" ry="28" fill="#FDF8F3"/>

  <!-- Ears -->
  <path d="M32 48 Q22 28 34 34 Q40 36 38 46 Z" fill="#FDF8F3" stroke="#E8DDD4" stroke-width="0.8"/>
  <path d="M88 48 Q98 28 86 34 Q80 36 82 46 Z" fill="#FDF8F3" stroke="#E8DDD4" stroke-width="0.8"/>
  
  <!-- Inner ears - warm pink -->
  <path d="M34 44 Q27 32 35 36 Q39 38 37 44 Z" fill="#F5C6C6" opacity="0.7"/>
  <path d="M86 44 Q93 32 85 36 Q81 38 83 44 Z" fill="#F5C6C6" opacity="0.7"/>

  <!-- Eyebrows - small expressive dots -->
  <ellipse cx="46" cy="50" rx="4" ry="2.5" fill="#5C4033" opacity="0.3"/>
  <ellipse cx="74" cy="50" rx="4" ry="2.5" fill="#5C4033" opacity="0.3"/>

  <!-- Eyes - dark brown, lively -->
  <ellipse cx="46" cy="56" rx="5" ry="5.5" fill="#3A2A1D"/>
  <ellipse cx="74" cy="56" rx="5" ry="5.5" fill="#3A2A1D"/>

  <!-- Eye shine -->
  <ellipse cx="44" cy="54" rx="2" ry="2" fill="white" opacity="0.9"/>
  <ellipse cx="72" cy="54" rx="2" ry="2" fill="white" opacity="0.9"/>

  <!-- Nose -->
  <ellipse cx="60" cy="66" rx="6" ry="4" fill="#3A2A1D"/>
  <!-- Nose highlight -->
  <ellipse cx="58" cy="65" rx="2" ry="1.2" fill="#5C4033" opacity="0.5"/>

  <!-- Mouth - happy smile -->
  <path d="M54 70 Q60 76 66 70" fill="none" stroke="#3A2A1D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Tongue peeking out with pant animation -->
  <path d="M56 72 Q56 80 60 80 Q64 80 64 72" fill="url(#tongueGrad)" opacity="0.85">
    <animate attributeName="d" 
      values="M56 72 Q56 80 60 80 Q64 80 64 72;M56 72 Q56 82 60 82 Q64 82 64 72;M56 72 Q56 80 60 80 Q64 80 64 72"
      dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Tongue line -->
  <line x1="60" y1="74" x2="60" y2="80" stroke="#D95B5B" stroke-width="0.5" opacity="0.5"/>

  <!-- Cheek blush -->
  <ellipse cx="36" cy="64" rx="4" ry="3" fill="#E07A2F" opacity="0.15"/>
  <ellipse cx="84" cy="64" rx="4" ry="3" fill="#E07A2F" opacity="0.15"/>

  <!-- Whisker dots -->
  <circle cx="50" cy="68" r="0.8" fill="#C4A98E" opacity="0.4"/>
  <circle cx="48" cy="70" r="0.8" fill="#C4A98E" opacity="0.4"/>
  <circle cx="70" cy="68" r="0.8" fill="#C4A98E" opacity="0.4"/>
  <circle cx="72" cy="70" r="0.8" fill="#C4A98E" opacity="0.4"/>

  <!-- Small decorative paw print accent at bottom -->
  <g transform="translate(60,104)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#E07A2F"/>
    <circle cx="-5" cy="-5" r="2" fill="#E07A2F"/>
    <circle cx="5" cy="-5" r="2" fill="#E07A2F"/>
  </g>
</svg>