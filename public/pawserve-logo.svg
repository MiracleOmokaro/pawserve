<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Premium shield badge base -->
  <defs>
    <linearGradient id="shieldGrad" x1="60" y1="4" x2="60" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#3A2A1D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="60" y1="0" x2="60" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E07A2F"/>
      <stop offset="100%" stop-color="#C96A1A"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M60 6 L106 30 L106 54 C106 82 88 104 60 114 C32 104 14 82 14 54 L14 30 Z"
        fill="url(#shieldGrad)" stroke="#6B8E5A" stroke-width="2.5"/>

  <!-- Inner shield border -->
  <path d="M60 14 L98 33 L98 54 C98 78 83 97 60 106 C37 97 22 78 22 54 L22 33 Z"
        fill="none" stroke="#E07A2F" stroke-width="1.2" opacity="0.5"/>

  <!-- Refined geometric paw — center pad -->
  <path d="M60 46 C52 46 46 52 46 60 C46 68 52 74 60 74 C68 74 74 68 74 60 C74 52 68 46 60 46Z"
        fill="#FDF8F3" opacity="0.95"/>

  <!-- Subtle inner pad curve -->
  <path d="M54 58 C56 54 64 54 66 58"
        fill="none" stroke="#5C4033" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Toe pads — teardrop/ellipse shapes, more mature than circles -->
  <ellipse cx="38" cy="44" rx="5" ry="7" transform="rotate(-30 38 44)" fill="#FDF8F3" opacity="0.9"/>
  <ellipse cx="52" cy="38" rx="5" ry="7" transform="rotate(-10 52 38)" fill="#FDF8F3" opacity="0.9"/>
  <ellipse cx="68" cy="38" rx="5" ry="7" transform="rotate(10 68 38)" fill="#FDF8F3" opacity="0.9"/>
  <ellipse cx="82" cy="44" rx="5" ry="7" transform="rotate(30 82 44)" fill="#FDF8F3" opacity="0.9"/>

  <!-- Subtle gold accent arc under the paw -->
  <path d="M50 80 C55 86 65 86 70 80"
        stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Corner decorative dots -->
  <circle cx="28" cy="28" r="2" fill="#6B8E5A" opacity="0.4"/>
  <circle cx="92" cy="28" r="2" fill="#6B8E5A" opacity="0.4"/>
  <circle cx="28" cy="68" r="2" fill="#6B8E5A" opacity="0.4"/>
  <circle cx="92" cy="68" r="2" fill="#6B8E5A" opacity="0.4"/>
</svg>