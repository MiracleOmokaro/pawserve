<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring — subtle badge -->
  <circle cx="60" cy="60" r="56" fill="#FDF8F3" stroke="#5C4033" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left ear -->
  <ellipse cx="32" cy="34" rx="14" ry="20" fill="#5C4033" transform="rotate(-25, 32, 34)"/>

  <!-- Right ear -->
  <ellipse cx="88" cy="34" rx="14" ry="20" fill="#5C4033" transform="rotate(25, 88, 34)"/>

  <!-- Left inner ear accent (warm orange) -->
  <ellipse cx="32" cy="34" rx="6" ry="11" fill="#E07A2F" transform="rotate(-25, 32, 34)"/>

  <!-- Right inner ear accent (warm orange) -->
  <ellipse cx="88" cy="34" rx="6" ry="11" fill="#E07A2F" transform="rotate(25, 88, 34)"/>

  <!-- Head -->
  <ellipse cx="60" cy="58" rx="30" ry="26" fill="#5C4033"/>

  <!-- Eyes -->
  <circle cx="46" cy="54" r="4" fill="#FDF8F3"/>
  <circle cx="74" cy="54" r="4" fill="#FDF8F3"/>

  <!-- Nose -->
  <ellipse cx="60" cy="66" rx="5" ry="3.5" fill="#E07A2F"/>

  <!-- Smile -->
  <path d="M 52 72 Q 60 78 68 72" stroke="#FDF8F3" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>