<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized 'n' letterform — elegant, minimal, modern -->
  <!-- Outer shape (clockwise) creates the n outline -->
  <!-- Inner shape (counter-clockwise) creates the open counter (hole) -->
  <path d="
    M 20 92
    L 20 30
    Q 20 16, 34 16
    L 86 16
    Q 100 16, 100 30
    L 100 92
    M 46 92
    L 46 42
    Q 46 34, 54 34
    L 74 34
    Q 82 34, 82 42
    L 82 92
  " fill="#5C4033" fill-rule="evenodd"/>
  <!-- Accent — playful dot suggesting a dog's ear tip -->
  <circle cx="86" cy="10" r="7" fill="#E07A2F"/>
</svg>